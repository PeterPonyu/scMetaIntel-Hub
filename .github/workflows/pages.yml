name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate static site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          if find site \( -iname 'PEERJ_REVIEWER_FAQ.md' -o -iname 'PEERJ_PORTAL_INPUTS.txt' -o -iname 'LITERATURE_SOTA_SCAN*.md' \) | grep -q .; then
            echo 'denylist markdown hit' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          root = Path("site")
          html = list(root.rglob("*.html"))
          assert html, "no html"
          print(f"ok {len(html)} html files")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
